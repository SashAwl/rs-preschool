<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Random game</title>
</head>

<body>
    <header></header>
    <div class="wrapper" id="game">
        <div class="start-wrapper">
            <div class="back-block"></div>
            <div class="start">
                <button class="start-button">
                    Play
                </button>
            </div>
        </div>

        <div class="block"></div>
        <div class="hole"></div>
        <div class="character"></div>
        <div class="game-over" style="display: none;">
            <div class="back-block"></div>
            <div class="game-over__text start">
                <h2 class="game-over__heading">Game over!</h2>
                <h4 class="score"></h4>
                <button class="start-button start-button--again" style="position: static;">
                    Play again
                </button>
                <details>
                    <summary class="last-games">Last games</summary>
                    <ul class="game-list"></ul>
                    <p class="record"></p>
                </details>
            </div>
        </div>
    </div>
